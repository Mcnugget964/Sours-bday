<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Connections</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-connections">
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open instructions">☰</button>
      <div class="brand">🍋</div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <section class="intro">
      <h1>Connections</h1>
      <div class="divider"></div>
    </section>

    <section class="cn-game">
      <p class="drag-help">let's see if you can clock these !</p>

      <div id="cnSolved" class="cn-solved-board"></div>
      <div id="cnGrid" class="cn-grid"></div>

      <p id="cnMessage" class="wl-message"></p>

      <div class="cn-dots-row">
        <span>Mistakes remaining:</span>
        <span id="cnDots"></span>
      </div>
    </section>

    <section class="controls">
      <button class="control-btn" id="cnShuffleBtn">
        <span class="control-icon">🔀</span>
        <span>SHUFFLE</span>
      </button>
      <button class="control-btn" id="cnDeselectBtn">
        <span class="control-icon">✕</span>
        <span>DESELECT</span>
      </button>
      <button class="control-btn" id="cnSubmitBtn">
        <span class="control-icon">↵</span>
        <span>SUBMIT</span>
      </button>
    </section>

    <p class="spangram-note">✦ Solve it to unlock the <span>next puzzle</span></p>
  </main>

  <div class="overlay hidden" id="modal">
    <div class="modal-card">
      <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="connections.js"></script>
</body>
</html>
