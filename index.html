<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Wordle #9926</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-wordle">
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open instructions">☰</button>
      <div class="brand">🍋</div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>

    <section class="intro">
      <div class="intro-title-row">
        <button class="orb-btn" id="orbBtn" aria-label="???">
          <svg class="orb-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
            <ellipse cx="20" cy="20" rx="15" ry="5.2" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="5" x2="20" y2="35" stroke="currentColor" stroke-width="2"/>
            <line x1="17" y1="2" x2="23" y2="2" stroke="currentColor" stroke-width="2"/>
            <line x1="20" y1="0" x2="20" y2="4" stroke="currentColor" stroke-width="2"/>
          </svg>
        </button>
        <h1>Wordle #9926</h1>
      </div>
      <div class="divider"></div>
      <div class="eyebrow">GUESS THE WORD</div>
      <div class="score"><span id="guessCount">0</span> / 6</div>
    </section>

    <section class="wl-game">
      <div id="wlBoard" class="wl-board" aria-label="Wordle board"></div>

      <p id="wlMessage" class="wl-message"></p>

      <div id="wlKeyboard" class="wl-keyboard" aria-label="Keyboard"></div>
    </section>

    <p class="spangram-note">✦ Solve it to unlock the <span>next puzzle</span></p>
  </main>

  <div class="overlay hidden" id="modal">
    <div class="modal-card">
      <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="wordle.js"></script>
</body>
</html>
