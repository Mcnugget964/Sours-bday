<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>read between the lines</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-strands">
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open instructions">☰</button>
      <div class="brand">🍋</div>
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">◖))</button>
    </header>

    <section class="intro">
      <h1>read between the lines</h1>
      <div class="divider"></div>
      <div class="eyebrow">WORDS FOUND</div>
      <div class="score"><span id="foundCount">0</span> / 7</div>
    </section>

    <section class="game">
      <div class="board-wrap">
        <svg id="lineLayer" class="line-layer" aria-hidden="true"></svg>
        <div id="grid" class="grid" aria-label="Letter grid"></div>
      </div>
      <p class="drag-help">☝︎ &nbsp;Drag to connect letters</p>
    </section>

    <section class="controls">
      <button class="control-btn" id="hintBtn">
        <span class="control-icon">💡</span>
        <span>HINT</span>
        <strong id="hintCount">3</strong>
      </button>
      <button class="control-btn" id="resetBtn">
        <span class="control-icon">↻</span>
        <span>RESET</span>
      </button>
      <button class="control-btn" id="howBtn">
        <span class="control-icon">?</span>
        <span>HOW TO PLAY</span>
      </button>
    </section>

    <p class="spannagram-note">✦ Find the <span>SPANNAGRAM</span> to complete the puzzle!</p>
  </main>

  <div class="overlay hidden" id="modal">
    <div class="modal-card">
      <button class="close-btn" id="closeModal" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
